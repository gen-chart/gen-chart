<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly Signups vs Target</title>
<style>
:root {
  --bg: #ffffff; --panel: #f8fafc; --ink: #0f172a; --muted: #64748b;
  --grid: #e2e8f0; --border: #e2e8f0; --axis: #94a3b8; --tooltip-bg: #0f172a; --tooltip-ink: #f8fafc;
  --cat-0: #2563eb; --cat-1: #059669; --cat-2: #d97706; --cat-3: #7c3aed; --cat-4: #db2777; --cat-5: #0891b2;
  --role-primary: #2563eb; --role-comparison: #64748b; --role-positive: #059669;
  --role-negative: #e11d48; --role-neutral: #94a3b8; --role-highlight: #d97706;
}
:root[data-theme="dark"] {
  --bg: #020617; --panel: #0f172a; --ink: #f8fafc; --muted: #94a3b8;
  --grid: #1e293b; --border: #1e293b; --axis: #475569; --tooltip-bg: #f8fafc; --tooltip-ink: #0f172a;
  --cat-0: #60a5fa; --cat-1: #34d399; --cat-2: #fbbf24; --cat-3: #a78bfa; --cat-4: #f472b6; --cat-5: #22d3ee;
  --role-primary: #60a5fa; --role-comparison: #94a3b8; --role-positive: #34d399;
  --role-negative: #fb7185; --role-neutral: #64748b; --role-highlight: #fbbf24;
}
@media (prefers-color-scheme: dark) {
  :root[data-theme="auto"] {
    --bg: #020617; --panel: #0f172a; --ink: #f8fafc; --muted: #94a3b8;
    --grid: #1e293b; --border: #1e293b; --axis: #475569; --tooltip-bg: #f8fafc; --tooltip-ink: #0f172a;
    --cat-0: #60a5fa; --cat-1: #34d399; --cat-2: #fbbf24; --cat-3: #a78bfa; --cat-4: #f472b6; --cat-5: #22d3ee;
    --role-primary: #60a5fa; --role-comparison: #94a3b8; --role-positive: #34d399;
    --role-negative: #fb7185; --role-neutral: #64748b; --role-highlight: #fbbf24;
  }
}
* { box-sizing: border-box; margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding: 2rem 1.25rem; display: flex; justify-content: center;
  transition: background 150ms, color 150ms;
}
.gc-wrap { width: 100%; max-width: 1040px; }
header { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.015em; }
.gc-subtitle { color: var(--muted); font-size: 0.875rem; margin-top: 0.2rem; }
.gc-toolbar { display: flex; gap: 0.5rem; flex: none; position: relative; }
.gc-btn {
  background: var(--panel); color: var(--ink); border: 1px solid var(--border);
  border-radius: 0.5rem; padding: 0.4rem 0.8rem; font: inherit; font-size: 0.8rem; cursor: pointer;
  transition: border-color 150ms, background 150ms;
}
.gc-btn:hover { border-color: var(--axis); }
.gc-btn:focus-visible { outline: 2px solid var(--role-primary); outline-offset: 2px; }
.gc-menu {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; display: none; min-width: 190px;
  background: var(--panel); border: 1px solid var(--border); border-radius: 0.6rem;
  padding: 0.35rem; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.22);
}
.gc-menu[data-open] { display: block; }
.gc-menu button {
  display: block; width: 100%; text-align: left; background: none; border: none; color: var(--ink);
  font: inherit; font-size: 0.8rem; padding: 0.42rem 0.6rem; border-radius: 0.4rem; cursor: pointer;
}
.gc-menu button:hover { background: var(--grid); }
.gc-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 1rem; padding: 1.25rem; position: relative; }
.gc-reset {
  position: absolute; top: 0.9rem; right: 0.9rem; display: none;
}
.gc-reset[data-on] { display: block; }
svg.gc-chart { display: block; width: 100%; height: auto; }
.gc-grid line { stroke: var(--grid); stroke-width: 1; }
.gc-axis { stroke: var(--axis); stroke-width: 1; }
.gc-yticks text, .gc-xticks text { fill: var(--muted); font-size: 11px; font-family: inherit; }
.gc-axis-label { fill: var(--muted); font-size: 11.5px; font-weight: 600; font-family: inherit; }
.gc-series rect { fill: var(--sc); }
.gc-line { fill: none; stroke: var(--sc); stroke-width: 2.25; stroke-linejoin: round; stroke-linecap: round; }
.gc-point { fill: var(--sc); }
.gc-series.gc-off { display: none; }
.gc-series.gc-dim { opacity: 0.22; }
.gc-annotations line { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4 3; }
.gc-annotations text { fill: var(--muted); font-size: 10.5px; font-family: inherit; }
.gc-annotations [data-gone] { display: none; }
.gc-crosshair { stroke: var(--axis); stroke-width: 1; stroke-dasharray: 2 3; }
.gc-hover-dot { fill: var(--sc); stroke: var(--bg); stroke-width: 1.5; }
.gc-brush-rect { fill: var(--role-primary); opacity: 0.14; display: none; }
.gc-hit { cursor: crosshair; }
.gc-legend { display: flex; flex-wrap: wrap; gap: 0.4rem 1.1rem; margin-top: 0.9rem; }
.gc-legend button {
  display: inline-flex; align-items: center; gap: 0.45rem; background: none; border: none;
  color: var(--ink); font: inherit; font-size: 0.82rem; cursor: pointer; padding: 0.15rem 0.2rem; border-radius: 0.3rem;
}
.gc-legend button:focus-visible { outline: 2px solid var(--role-primary); outline-offset: 2px; }
.gc-legend button[aria-pressed="false"] { color: var(--muted); text-decoration: line-through; }
.gc-legend button[aria-pressed="false"] .gc-swatch { opacity: 0.35; }
.gc-legend[data-static] button { cursor: default; }
.gc-swatch { width: 14px; height: 4px; border-radius: 2px; background: var(--sw); flex: none; }
.gc-swatch[data-mark="bar"] { height: 11px; border-radius: 2.5px; }
.gc-passport {
  display: none; margin-top: 0.9rem; border-top: 1px solid var(--border); padding-top: 0.8rem;
  font-size: 0.82rem;
}
.gc-passport[data-open] { display: flex; align-items: center; gap: 1.2rem; flex-wrap: wrap; }
.gc-passport .gc-pp-name { font-weight: 700; display: inline-flex; align-items: center; gap: 0.45rem; }
.gc-passport .gc-pp-dot { width: 9px; height: 9px; border-radius: 50%; }
.gc-passport dl { display: inline-flex; gap: 1.2rem; margin: 0; }
.gc-passport dt { color: var(--muted); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; }
.gc-passport dd { margin: 0; font-variant-numeric: tabular-nums; font-weight: 600; }
.gc-passport .gc-pp-close { margin-left: auto; }
.gc-tooltip {
  position: fixed; z-index: 10; pointer-events: none; display: none;
  background: var(--tooltip-bg); color: var(--tooltip-ink);
  border-radius: 0.5rem; padding: 0.5rem 0.7rem; font-size: 0.78rem; line-height: 1.45;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25); max-width: 260px;
}
.gc-tooltip .gc-tt-x { font-weight: 700; margin-bottom: 0.2rem; }
.gc-tooltip .gc-tt-row { display: flex; align-items: center; gap: 0.4rem; white-space: nowrap; }
.gc-tooltip .gc-tt-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.gc-tooltip .gc-tt-val { margin-left: auto; font-variant-numeric: tabular-nums; padding-left: 0.8rem; }
.gc-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0.9rem; margin-top: 1rem; }
.gc-card { background: var(--panel); border: 1px solid var(--border); border-radius: 0.75rem; padding: 0.9rem 1.1rem; }
.gc-card h2 { font-size: 0.82rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 0.45rem; }
.gc-card ul { padding-left: 1.1rem; font-size: 0.85rem; }
.gc-card li { margin: 0.2rem 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
(function () {
  'use strict';
  var payload = JSON.parse(document.getElementById('gc-payload').textContent);
  var root = document.documentElement;
  var svg = document.querySelector('svg.gc-chart');
  var plot = payload.plot;
  var hidden = {};
  var focusId = null;
  var zoom = null; // [i0, i1] data-index window, or null

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function slug() {
    return String(payload.title).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'chart';
  }

  // ---------------------------------------------------------- deep links
  function readHash() {
    var out = {};
    location.hash.replace(/^#/, '').split('&').forEach(function (kv) {
      var i = kv.indexOf('=');
      if (i > 0) out[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1));
    });
    return out;
  }
  function writeHash() {
    var parts = [];
    var theme = root.getAttribute('data-theme');
    if (theme !== 'auto') parts.push('theme=' + theme);
    if (focusId) parts.push('focus=' + encodeURIComponent(focusId));
    var off = Object.keys(hidden).filter(function (k) { return hidden[k]; });
    if (off.length) parts.push('hidden=' + off.map(encodeURIComponent).join(','));
    if (zoom) parts.push('brush=' + zoom[0] + '~' + zoom[1]);
    history.replaceState(null, '', parts.length ? '#' + parts.join('&') : location.pathname);
  }

  // -------------------------------------------------------------- theme
  document.getElementById('gc-theme').addEventListener('click', function () {
    var current = root.getAttribute('data-theme');
    if (current === 'auto') {
      current = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    root.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
    writeHash();
  });

  // ------------------------------------------------------------- legend
  var legend = document.querySelector('.gc-legend');
  function applyHidden(id) {
    var g = svg.querySelector('.gc-series[data-series="' + CSS.escape(id) + '"]');
    if (g) g.classList.toggle('gc-off', !!hidden[id]);
    if (legend) {
      var btn = legend.querySelector('button[data-series="' + CSS.escape(id) + '"]');
      if (btn) btn.setAttribute('aria-pressed', hidden[id] ? 'false' : 'true');
    }
  }
  if (legend && payload.legendToggle) {
    legend.addEventListener('click', function (e) {
      var btn = e.target.closest('button[data-series]');
      if (!btn) return;
      var id = btn.getAttribute('data-series');
      hidden[id] = !hidden[id];
      applyHidden(id);
      if (focusId === id && hidden[id]) setFocus(null);
      hideTip();
      writeHash();
    });
    legend.addEventListener('dblclick', function (e) {
      var btn = e.target.closest('button[data-series]');
      if (!btn) return;
      setFocus(btn.getAttribute('data-series'));
      writeHash();
    });
  } else if (legend) {
    legend.setAttribute('data-static', '');
  }

  // ------------------------------------------------------ data passport
  var passport = document.getElementById('gc-passport');
  function setFocus(id) {
    focusId = id && !hidden[id] ? id : null;
    payload.series.forEach(function (s) {
      var g = svg.querySelector('.gc-series[data-series="' + CSS.escape(s.id) + '"]');
      if (g) g.classList.toggle('gc-dim', !!focusId && s.id !== focusId);
    });
    if (!focusId) {
      passport.removeAttribute('data-open');
      passport.innerHTML = '';
      return;
    }
    var s = payload.series.find(function (x) { return x.id === focusId; });
    var st = s.stats || {};
    var u = payload.unit ? ' ' + esc(payload.unit) : '';
    passport.innerHTML =
      '<span class="gc-pp-name"><span class="gc-pp-dot" style="background:' + s.color + '"></span>' + esc(s.label) + '</span>' +
      '<dl><div><dt>min</dt><dd>' + fmt(st.min) + u + '</dd></div>' +
      '<div><dt>max</dt><dd>' + fmt(st.max) + u + '</dd></div>' +
      '<div><dt>mean</dt><dd>' + fmt(st.mean) + u + '</dd></div>' +
      '<div><dt>last</dt><dd>' + fmt(st.last) + u + '</dd></div>' +
      '<div><dt>points</dt><dd>' + (st.count || 0) + '</dd></div></dl>' +
      '<button class="gc-btn gc-pp-close" type="button">Close</button>';
    passport.setAttribute('data-open', '');
    passport.querySelector('.gc-pp-close').addEventListener('click', function () {
      setFocus(null);
      writeHash();
    });
  }
  function fmt(v) {
    if (v === null || v === undefined) return '—';
    var r = Math.round(v * 100) / 100;
    return String(r).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }
  svg.addEventListener('click', function (e) {
    var g = e.target.closest('.gc-series');
    if (g) {
      var id = g.getAttribute('data-series');
      setFocus(focusId === id ? null : id);
      writeHash();

  // --------------------------------------------------------- brush zoom
  // Zoom is an affine remap of original x pixels; y never rescales, so the
  // reading stays honest. Only line marks over time/linear x support it.
  var resetBtn = document.getElementById('gc-reset');
  var brushRect = svg.querySelector('.gc-brush-rect');
  function zoomX(ox) {
    if (!zoom) return ox;
    var a = payload.xPixels[zoom[0]];
    var b = payload.xPixels[zoom[1]];
    return plot.left + ((ox - a) / (b - a)) * (plot.right - plot.left);
  }
  function visibleRange() {
    return zoom ? zoom : [0, payload.xPixels.length - 1];
  }
  function applyZoom() {
    var r = visibleRange();
    payload.series.forEach(function (s) {

      var pen = false;
      for (var i = r[0]; i <= r[1]; i++) {
        if (s.pixels[i] === null) { pen = false; continue; }
        d += (pen ? 'L' : 'M') + zoomX(payload.xPixels[i]).toFixed(1) + ' ' + s.pixels[i];
        pen = true;
      }
      g.querySelector('.gc-line').setAttribute('d', d || 'M0 0');
      var pts = g.querySelectorAll('.gc-point');
      var pi = 0;
      for (var j = 0; j < s.pixels.length; j++) {
        if (s.pixels[j] === null) continue;
        var c = pts[pi++];
        if (!c) break;
        if (j < r[0] || j > r[1]) { c.style.display = 'none'; }
        else {
          c.style.display = '';
          c.setAttribute('cx', zoomX(payload.xPixels[j]).toFixed(1));
        }
      }
    });
    svg.querySelectorAll('.gc-annotations [data-ox]').forEach(function (el) {
      var ox = Number(el.getAttribute('data-ox'));
      var nx = zoomX(ox);
      var inside = nx >= plot.left - 0.5 && nx <= plot.right + 0.5;
      el.toggleAttribute('data-gone', !inside);
      if (el.tagName === 'line') { el.setAttribute('x1', nx); el.setAttribute('x2', nx); }
      else el.setAttribute('x', nx + 5);
    });
    rebuildXTicks();
    resetBtn.toggleAttribute('data-on', !!zoom);
  }
  function rebuildXTicks() {
    var g = svg.querySelector('.gc-xticks');
    if (!zoom) { g.innerHTML = originalTicks; return; }
    var r = visibleRange();
    var count = Math.min(7, r[1] - r[0] + 1);
    var html = '';
    for (var k = 0; k < count; k++) {
      var i = r[0] + Math.round((k * (r[1] - r[0])) / Math.max(1, count - 1));
      html += '<text x="' + zoomX(payload.xPixels[i]).toFixed(1) + '" y="' + (plot.bottom + 16) +
        '" text-anchor="middle">' + esc(payload.xLabels[i]) + '</text>';
    }
    g.innerHTML = html;
  }
  var originalTicks = svg.querySelector('.gc-xticks').innerHTML;
  function setZoom(i0, i1) {
    zoom = (i0 !== null && i1 - i0 >= 1) ? [i0, i1] : null;
    applyZoom();
    writeHash();
  }
  resetBtn.addEventListener('click', function () { setZoom(null); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { setZoom(null); setFocus(null); writeHash(); }
  });

  // ------------------------------------------------- tooltip + pointer
  var tooltip = document.getElementById('gc-tooltip');
  var crosshair = svg.querySelector('.gc-crosshair');
  var hit = svg.querySelector('.gc-hit');
  var dots = {};
  svg.querySelectorAll('.gc-hover-dot').forEach(function (d) { dots[d.getAttribute('data-for')] = d; });

  function svgX(evt) {
    var rect = svg.getBoundingClientRect();
    return (evt.clientX - rect.left) * (payload.width / rect.width);
  }
  function nearest(x) {
    var r = visibleRange();
    var best = r[0];
    var bd = Infinity;
    for (var i = r[0]; i <= r[1]; i++) {
      var d = Math.abs(zoomX(payload.xPixels[i]) - x);
      if (d < bd) { bd = d; best = i; }
    }
    return best;
  }
  function hideTip() {
    tooltip.style.display = 'none';
    crosshair.style.display = 'none';
    Object.keys(dots).forEach(function (k) { dots[k].style.display = 'none'; });
  }
  function showTip(evt) {
    var i = nearest(svgX(evt));
    var px = zoomX(payload.xPixels[i]);
    crosshair.setAttribute('x1', px);
    crosshair.setAttribute('x2', px);
    crosshair.style.display = '';
    var html = '<div class="gc-tt-x">' + esc(payload.xLabels[i]) + '</div>';
    payload.series.forEach(function (s) {
      if (hidden[s.id]) { if (dots[s.id]) dots[s.id].style.display = 'none'; return; }
      var v = s.formatted[i];
      html += '<div class="gc-tt-row"><span class="gc-tt-dot" style="background:' + s.color + '"></span>'
        + esc(s.label) + '<span class="gc-tt-val">' + esc(v === null ? '—' : v)
        + (payload.unit && s.values[i] !== null ? ' ' + esc(payload.unit) : '') + '</span></div>';
      if (dots[s.id]) {
        if (s.pixels[i] === null) { dots[s.id].style.display = 'none'; }
        else {
          dots[s.id].setAttribute('cx', px);
          dots[s.id].setAttribute('cy', s.pixels[i]);
          dots[s.id].style.display = '';
        }
      }
    });
    tooltip.innerHTML = html;
    tooltip.style.display = 'block';
    var pad = 14;
    var tw = tooltip.offsetWidth;
    var x = evt.clientX + pad;
    if (x + tw > window.innerWidth - 8) x = evt.clientX - tw - pad;
    tooltip.style.left = x + 'px';
    tooltip.style.top = Math.max(8, evt.clientY - tooltip.offsetHeight / 2) + 'px';
  }
  if (payload.tooltip !== 'off' && hit) {
    hit.addEventListener('pointermove', function (evt) { if (!brushing) showTip(evt); });
    hit.addEventListener('pointerleave', hideTip);
  }

  // Brush drag on the hit rect.
  var brushing = null;
  if (payload.brush === 'x' && hit && brushRect) {
    hit.addEventListener('pointerdown', function (evt) {
      brushing = svgX(evt);
      hit.setPointerCapture(evt.pointerId);
      hideTip();
    });
    hit.addEventListener('pointermove', function (evt) {
      if (brushing === null) return;
      var x = svgX(evt);
      var a = Math.max(plot.left, Math.min(brushing, x));
      var b = Math.min(plot.right, Math.max(brushing, x));
      brushRect.setAttribute('x', a);
      brushRect.setAttribute('y', plot.top);
      brushRect.setAttribute('width', Math.max(0, b - a));
      brushRect.setAttribute('height', plot.bottom - plot.top);
      brushRect.style.display = 'block';
    });
    hit.addEventListener('pointerup', function (evt) {
      if (brushing === null) return;
      var x = svgX(evt);
      var a = Math.min(brushing, x);
      var b = Math.max(brushing, x);
      brushing = null;
      brushRect.style.display = 'none';
      if (b - a < 8) return; // a click, not a brush
      var i0 = nearest(a);
      var i1 = nearest(b);
      if (i1 > i0) setZoom(i0, i1);
    });
  }

  // ------------------------------------------------------------ exports
  var exportBtn = document.getElementById('gc-export-btn');
  var exportMenu = document.getElementById('gc-export-menu');
  exportBtn.addEventListener('click', function () {
    var open = exportMenu.toggleAttribute('data-open');
    exportBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.gc-toolbar')) {
      exportMenu.removeAttribute('data-open');
      exportBtn.setAttribute('aria-expanded', 'false');
    }
  });

  var TOKENS = ['--bg', '--panel', '--ink', '--muted', '--grid', '--border', '--axis',
    '--cat-0', '--cat-1', '--cat-2', '--cat-3', '--cat-4', '--cat-5',
    '--role-primary', '--role-comparison', '--role-positive', '--role-negative', '--role-neutral', '--role-highlight'];
  var SVG_CSS = 'text{font-family:system-ui,-apple-system,sans-serif}' +
    '.gc-grid line{stroke:var(--grid)}.gc-axis{stroke:var(--axis)}' +
    '.gc-yticks text,.gc-xticks text{fill:var(--muted);font-size:11px}' +
    '.gc-axis-label{fill:var(--muted);font-size:11.5px;font-weight:600}' +
    '.gc-series rect{fill:var(--sc)}' +
    '.gc-line{fill:none;stroke:var(--sc);stroke-width:2.25;stroke-linejoin:round;stroke-linecap:round}' +
    '.gc-point{fill:var(--sc)}' +
    '.gc-annotations line{stroke:var(--muted);stroke-dasharray:4 3}' +
    '.gc-annotations text{fill:var(--muted);font-size:10.5px}';

  // Canonical export: full authored chart at rest — no hover layer, no
  // hidden/dimmed series, no zoom remap.
  function exportSvgString() {
    var clone = svg.cloneNode(true);
    var hover = clone.querySelector('.gc-hover');
    if (hover) hover.remove();
    clone.querySelectorAll('.gc-off, .gc-dim').forEach(function (el) {
      el.classList.remove('gc-off', 'gc-dim');
    });
    if (zoom) {
      clone.querySelector('.gc-xticks').innerHTML = originalTicks;
      // Re-render marks at rest by rebuilding from payload.
      payload.series.forEach(function (s) {
        if (s.mark !== 'line') return;
        var g = clone.querySelector('.gc-series[data-series="' + CSS.escape(s.id) + '"]');
        if (!g) return;
        var d = '';
        var pen = false;
        for (var i = 0; i < s.pixels.length; i++) {
          if (s.pixels[i] === null) { pen = false; continue; }
          d += (pen ? 'L' : 'M') + payload.xPixels[i] + ' ' + s.pixels[i];
          pen = true;
        }
        g.querySelector('.gc-line').setAttribute('d', d);
        var pts = g.querySelectorAll('.gc-point');
        var pi = 0;
        for (var j = 0; j < s.pixels.length; j++) {
          if (s.pixels[j] === null) continue;
          var c = pts[pi++];
          if (c) { c.style.display = ''; c.setAttribute('cx', payload.xPixels[j]); }
        }
      });
      clone.querySelectorAll('.gc-annotations [data-ox]').forEach(function (el) {
        var ox = Number(el.getAttribute('data-ox'));
        el.removeAttribute('data-gone');
        if (el.tagName === 'line') { el.setAttribute('x1', ox); el.setAttribute('x2', ox); }
        else el.setAttribute('x', ox + 5);
      });
    }
    var cs = getComputedStyle(root);
    var tokens = TOKENS.map(function (t) { return t + ':' + cs.getPropertyValue(t).trim(); }).join(';');
    var style = document.createElementNS('http://www.w3.org/2000/svg', 'style');
    style.textContent = 'svg{' + tokens + '}' + SVG_CSS;
    clone.insertBefore(style, clone.firstChild);
    clone.setAttribute('width', payload.width);
    clone.setAttribute('height', payload.height);
    return new XMLSerializer().serializeToString(clone);
  }
  function download(name, blob) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  function svgToCanvas(scale, cb) {
    var img = new Image();
    var url = URL.createObjectURL(new Blob([exportSvgString()], { type: 'image/svg+xml' }));
    img.onload = function () {
      var canvas = document.createElement('canvas');
      canvas.width = payload.width * scale;
      canvas.height = payload.height * scale;
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = getComputedStyle(root).getPropertyValue('--panel').trim();
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      cb(canvas);
    };
    img.src = url;
  }
  function csvString() {
    var esc2 = function (v) {
      if (v === null || v === undefined) return '';
      var s = String(v);
      return /[",\n]/.test(s) ? '"' + s.replaceAll('"', '""') + '"' : s;
    };
    var lines = [[payload.xHeader].concat(payload.series.map(function (s) { return s.label; })).map(esc2).join(',')];
    for (var i = 0; i < payload.xValues.length; i++) {
      lines.push([payload.xValues[i]].concat(payload.series.map(function (s) { return s.values[i]; })).map(esc2).join(','));
    }
    return lines.join('\n') + '\n';
  }
  exportMenu.addEventListener('click', function (e) {
    var kind = e.target.closest('button[data-export]');
    if (!kind) return;
    kind = kind.getAttribute('data-export');
    exportMenu.removeAttribute('data-open');
    if (kind === 'svg') {
      download(slug() + '.svg', new Blob([exportSvgString()], { type: 'image/svg+xml' }));
    } else if (kind === 'csv') {
      download(slug() + '.csv', new Blob([csvString()], { type: 'text/csv' }));
    } else if (kind === 'png') {
      svgToCanvas(2, function (canvas) {
        canvas.toBlob(function (b) { download(slug() + '.png', b); }, 'image/png');
      });
    } else if (kind === 'card') {
      svgToCanvas(2, function (chart) {
        var cs = getComputedStyle(root);
        var canvas = document.createElement('canvas');
        canvas.width = 1200;
        canvas.height = 630;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = cs.getPropertyValue('--bg').trim();
        ctx.fillRect(0, 0, 1200, 630);
        ctx.fillStyle = cs.getPropertyValue('--ink').trim();
        ctx.font = '700 30px system-ui, sans-serif';
        ctx.fillText(payload.title, 48, 64);
        var boxW = 1104;
        var boxH = 630 - 100 - 32;
        var s = Math.min(boxW / chart.width, boxH / chart.height);
        var w = chart.width * s;
        var h = chart.height * s;
        ctx.drawImage(chart, (1200 - w) / 2, 100 + (boxH - h) / 2, w, h);
        canvas.toBlob(function (b) { download(slug() + '-share.png', b); }, 'image/png');
      });
    }
  });

  // -------------------------------------------------- restore deep link
  var h = readHash();
  if (h.theme === 'dark' || h.theme === 'light') root.setAttribute('data-theme', h.theme);
  if (h.hidden) {
    h.hidden.split(',').forEach(function (id) {
      if (payload.series.some(function (s) { return s.id === id; })) {
        hidden[id] = true;
        applyHidden(id);
      }
    });
  }
  if (h.focus && payload.series.some(function (s) { return s.id === h.focus; })) setFocus(h.focus);
  if (h.brush && payload.brush === 'x') {
    var m = /^(\d+)~(\d+)$/.exec(h.brush);
    if (m) {
      var i0 = Math.max(0, Math.min(+m[1], payload.xPixels.length - 1));
      var i1 = Math.max(0, Math.min(+m[2], payload.xPixels.length - 1));
      if (i1 > i0) { zoom = [i0, i1]; applyZoom(); }
    }
  }
})();
</script>
</body>
</html>
